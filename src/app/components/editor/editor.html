<section class="panel">
  <div class="panel-title">
    <span class="panel-icon">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#5b4dbd"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </span>
    @if (!modoVisual) {
      <h2>Editor de texto</h2>
    } @else {
      <h2>Lector</h2>
    }
  </div>

  <div class="toolbar-container">
    <div class="toolbar">
      <button
        (click)="disminuirFuente()"
        type="button"
        class="btn-font"
        [disabled]="zoomLevel <= ZOOM_MIN"
        title="Disminuir tamaño"
      >
        A-
      </button>

      <span class="zoom-indicator">{{ zoomLevel }}%</span>

      <button
        (click)="aumentarFuente()"
        type="button"
        class="btn-font"
        [disabled]="zoomLevel >= ZOOM_MAX"
        title="Aumentar tamaño"
      >
        A+
      </button>

      <span class="divider"></span>

      <button (click)="limpiar()" type="button" class="btn-clear" title="Limpiar editor">
        Limpiar
      </button>

      <span class="divider"></span>
      <button
        (click)="mostrarTabla = true"
        type="button"
        class="btn-tabla"
        title="Ver tabla de transiciones"
      >
        Ver tabla
      </button>

      <span class="divider"></span>

      <button
        type="button"
        class="eye-button"
        [class.active]="modoVisual"
        (click)="modoVisual = !modoVisual"
        title="Alternar vista de resaltado"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="editor-content-area">
    <textarea
      #editor
      class="editor-textarea"
      [hidden]="modoVisual"
      (input)="alCambiarTexto()"
      [style.fontSize]="fontSize"
      autocorrect="off"
      autocapitalize="off"
      autocomplete="off"
      spellcheck="false"
      placeholder="Escriba su texto aquí..."
    ></textarea>
    <div
      [hidden]="!modoVisual"
      class="texto-resaltado"
      [innerHTML]="textoResaltado"
      [style.fontSize]="fontSize"
    ></div>
  </div>

  <div class="empty-footer"></div>
  <app-tabla [visible]="mostrarTabla" (cerrarModal)="mostrarTabla = false"></app-tabla>
</section>
