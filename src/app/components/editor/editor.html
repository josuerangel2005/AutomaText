<section class="panel">
  <div class="panel-title">
    <span class="panel-icon">
      <svg
        width="28"
        height="28"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#5b4dbd"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
        <polyline points="14 2 14 8 20 8"></polyline>
        <line x1="16" y1="13" x2="8" y2="13"></line>
        <line x1="16" y1="17" x2="8" y2="17"></line>
        <polyline points="10 9 9 9 8 9"></polyline>
      </svg>
    </span>
    <h2>Editor de texto</h2>
  </div>

  <div class="toolbar-container">
    <div class="toolbar">
      <button type="button" class="btn-bold">B</button>
      <button type="button" class="btn-italic">I</button>
      <button type="button" class="btn-underline">U</button>

      <span class="divider"></span>

      <button type="button" class="btn-align">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="18" y1="10" x2="6" y2="10"></line>
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="18" y1="18" x2="6" y2="18"></line>
        </svg>
      </button>
      <button type="button" class="btn-align">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="18" y1="10" x2="6" y2="10"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="18" y1="18" x2="6" y2="18"></line>
        </svg>
      </button>
      <button type="button" class="btn-align">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="21" y1="6" x2="3" y2="6"></line>
          <line x1="21" y1="10" x2="3" y2="10"></line>
          <line x1="21" y1="14" x2="3" y2="14"></line>
          <line x1="21" y1="18" x2="3" y2="18"></line>
        </svg>
      </button>

      <span class="divider"></span>

      <button type="button">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="9" y1="6" x2="20" y2="6"></line>
          <line x1="9" y1="12" x2="20" y2="12"></line>
          <line x1="9" y1="18" x2="20" y2="18"></line>
          <line x1="5" y1="6" x2="5.01" y2="6"></line>
          <line x1="5" y1="12" x2="5.01" y2="12"></line>
          <line x1="5" y1="18" x2="5.01" y2="18"></line>
        </svg>
      </button>
      <button type="button">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <line x1="10" y1="6" x2="21" y2="6"></line>
          <line x1="10" y1="12" x2="21" y2="12"></line>
          <line x1="10" y1="18" x2="21" y2="18"></line>
          <path d="M4 6h1v4"></path>
          <path d="M4 10h2"></path>
          <path d="M6 18H4c0-1 2-2 2-3s-1-1.5-2-1"></path>
        </svg>
      </button>

      <span class="divider"></span>

      <button type="button">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="m21.64 3.64-1.28-1.28a1.21 1.21 0 0 0-1.72 0L14 7 3.45 17.55a1 1 0 0 0 0 1.42l3.58 3.58a1 1 0 0 0 1.42 0L19 12l4.64-4.64a1.21 1.21 0 0 0 0-1.72Z"
          ></path>
          <path d="M14 7 3.45 17.55O"></path>
          <path d="m18 11-3-3"></path>
          <path d="M2 22h20"></path>
        </svg>
      </button>
      <button type="button" class="btn-text-size">
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
        >
          <polyline points="4 7 4 4 20 4 20 7"></polyline>
          <line x1="9" y1="20" x2="15" y2="20"></line>
          <line x1="12" y1="4" x2="12" y2="20"></line>
        </svg>
      </button>

      <button
        type="button"
        class="eye-button"
        [class.active]="mostrarResaltado"
        (click)="mostrarResaltado = !mostrarResaltado"
        title="Alternar vista de resaltado"
      >
        <svg
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
          <circle cx="12" cy="12" r="3"></circle>
        </svg>
      </button>
    </div>
  </div>

  <div class="editor-content-area">
    <textarea
      *ngIf="!mostrarResaltado"
      [(ngModel)]="textoOriginal"
      (ngModelChange)="alCambiarTexto()"
      class="editor-textarea"
      placeholder="Escribe o pega aquí tu texto..."
    ></textarea>

    <div *ngIf="mostrarResaltado" class="texto-resaltado" [innerHTML]="textoResaltado"></div>
  </div>

  <div class="empty-footer"></div>
</section>
