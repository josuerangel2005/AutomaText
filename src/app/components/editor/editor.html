<section class="panel">
  <div class="panel-title">
    <span class="panel-icon">📝</span>
    <h2>Editor de texto</h2>
  </div>

  <div class="toolbar">
    <button type="button"><b>B</b></button>
    <button type="button"><i>I</i></button>
    <button type="button"><u>U</u></button>
    <button type="button">≡</button>
    <button type="button">☰</button>
    <button type="button">⋮</button>
    <button type="button">▧</button>
    <button type="button">TT</button>
    <button type="button" (click)="mostrarResaltado = !mostrarResaltado">👁</button>
  </div>

  <textarea
    *ngIf="!mostrarResaltado"
    [(ngModel)]="textoOriginal"
    (ngModelChange)="alCambiarTexto()"
    class="editor-textarea"
    placeholder="Escribe o pega aquí tu texto..."
  ></textarea>

  <div *ngIf="mostrarResaltado" class="texto-resaltado" [innerHTML]="textoResaltado"></div>
</section>
