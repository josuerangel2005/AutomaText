<section class="panel search-panel">
  <div class="panel-title">
    <span class="panel-icon">
      <svg
        width="24"
        height="24"
        viewBox="0 0 24 24"
        fill="none"
        stroke="#5b4dbd"
        stroke-width="2.5"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
    </span>
    <h2>Búsqueda</h2>
  </div>
  <div class="search-row">
    <div class="input-container">
      <input
        [(ngModel)]="patron"
        (keydown.enter)="buscar(); $event.preventDefault()"
        type="text"
        class="search-input"
        placeholder="Automatas"
      />
    </div>
    <button (click)="buscar()" type="button" class="search-button">
      <svg
        width="16"
        height="16"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="3"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <circle cx="11" cy="11" r="8"></circle>
        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
      </svg>
      <span>Buscar</span>
    </button>
  </div>
  <label class="checkbox-row">
    <span class="checkbox-item">
      <input [(ngModel)]="ignorarMayusculas" type="checkbox" class="custom-checkbox" />
      <span class="checkbox-text">Ignorar mayúsculas/minúsculas</span>
    </span>
    <span class="checkbox-item">
      <input [(ngModel)]="ignorarEspaciosEnBlanco" type="checkbox" class="custom-checkbox" />
      <span class="checkbox-text">Ignorar espacios en blanco</span>
    </span>
  </label>
  <div class="results-header">
    <h3>Resultados</h3>
    <span class="results-count">{{ totalCoincidencias }}</span>
  </div>
  <div class="results-list">
    @for (coincidencia of resultados; track coincidencia.titulo) {
      <app-results
        class="result-item"
        [title]="coincidencia.titulo"
        [meta]="'Línea ' + coincidencia.linea + ', posición ' + coincidencia.posicion"
        [snippet]="coincidencia.snippet"
      ></app-results>
    }
  </div>
</section>
